# GoReleaser configuration for Rosia CLI
# Documentation: https://goreleaser.com

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: rosia
    main: ./main.go
    binary: rosia
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/raucheacho/rosia-cli/cmd.version={{.Version}}
      - -X github.com/raucheacho/rosia-cli/cmd.commit={{.Commit}}
      - -X github.com/raucheacho/rosia-cli/cmd.date={{.Date}}

archives:
  - id: rosia-archive
    name_template: "rosia_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - profiles/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: raucheacho
    name: rosia-cli

# Homebrew tap
brews:
  - name: rosia
    repository:
      owner: raucheacho
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/raucheacho/rosia-cli
    description: "Clean development dependencies and caches"
    license: MIT
    test: |
      system "#{bin}/rosia", "version"
    install: |
      bin.install "rosia"

# Scoop bucket
scoops:
  - repository:
      owner: raucheacho
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/raucheacho/rosia-cli
    description: "Clean development dependencies and caches"
    license: MIT
